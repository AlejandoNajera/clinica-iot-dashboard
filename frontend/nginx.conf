# Configuración de Nginx para el frontend React (SPA)
# Actúa como proxy reverso hacia el backend FastAPI

server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Gzip para mejor rendimiento
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;

    # ── Proxy hacia la API Backend ──────────────────────────────────────
    # Todas las rutas /api/* se redirigen al contenedor "backend"
    location /api/ {
        proxy_pass         http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # ── React SPA: redirige todo a index.html ──────────────────────────
    # Necesario para que React Router funcione correctamente
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ── Caché de assets estáticos ──────────────────────────────────────
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}